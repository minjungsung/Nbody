name: Sync Wiki
on:
  push:
    paths:
      - "docs/wiki/**"
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Sync docs/wiki to GitHub Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs/wiki
        env:
          GH_TOKEN: ${{ github.token }}
          GH_MAIL: minjungsung@users.noreply.github.com
          GH_NAME: minjungsung

